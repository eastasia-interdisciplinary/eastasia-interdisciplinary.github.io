title: 동아시아학제연구회
tagline: East Asian Studies & Transdisciplinary Research Group
short_name_en: EAST Research Group # used where the full name would crowd a sentence
leader_name: 이용우 # signs the introduction on /about/
# Group contact. Deliberately the leader's own address rather than the one on
# his people-page card, which is his university address.
contact_email: "yiyw0417@gmail.com"
# Tighter crop of the same photo: his people-page portrait is a wide café
# scene, which at byline size left him a small figure in it.
leader_photo: yongwoo-yi-byline.jpg
# Used for the meta description and link-preview text. Kept in step with the
# group's own introduction on the home page.
description: >-
  한국고등교육재단 장학생들을 중심으로 2025년 8월에 시작된 학술 연구모임입니다.
  다양한 분야를 전공하는 구성원들이 동아시아를 공통의 관심사로 삼아 함께
  공부합니다.
description_en: >-
  An academic group founded in August 2025 by scholars and students
  supported by the Korea Foundation for Advanced Studies, studying East
  Asia across a wide range of disciplines.
url: "https://eastresearch.github.io"
baseurl: "" # root org page site, no path prefix
lang: ko-KR # drives og:locale; jekyll-seo-tag defaulted it to en_US

# Link preview card for Kakao/Slack/X, generated by tools/make_images.py.
# jekyll-seo-tag only reads page.image -- a top-level site.image is ignored --
# so it is applied to every page through front matter defaults below.
twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-cover.jpg

# The foundation whose scholarship recipients make up the group, per its own
# introduction. Replaced a 문우림-specific set of fields, which described one
# program rather than the membership as the group states it.
foundation_name: 한국고등교육재단
foundation_name_en: Korea Foundation for Advanced Studies
foundation_url: "https://www.kfas.or.kr"

repo_url: "https://github.com/eastresearch/eastresearch.github.io"

markdown: kramdown
kramdown:
  # Every entry is written twice, once per language, so a heading in the
  # body would otherwise be given the same generated id in both copies.
  # Nothing links to those anchors; the ids on the seminar page are set
  # by hand in the template.
  auto_ids: false
permalink: /news/:year/:month/:day/:title/

collections:
  seminar:
    output: true
    permalink: /seminar/:year-:month-:day-:title/
    sort_by: date

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools # importer scripts; they were being published alongside the site
