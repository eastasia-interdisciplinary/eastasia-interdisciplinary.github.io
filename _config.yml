title: 동아시아학제연구모임
tagline: East Asia Interdisciplinary Studies Group
# Used for the meta description and link-preview text. Kept in step with the
# group's own introduction on the home page.
description: >-
  한국고등교육재단 장학생들을 중심으로 2025년 8월에 시작된 학술 연구모임입니다.
  다양한 분야를 전공하는 구성원들이 동아시아를 공통의 관심사로 삼아 함께
  공부합니다.
description_en: >-
  An academic group founded in August 2025 by scholars and students
  supported by the Korea Foundation for Advanced Studies, studying East
  Asia across a wide range of disciplines.
url: "https://eastasia-interdisciplinary.github.io"
baseurl: "" # root org page site, no path prefix
lang: ko-KR # drives og:locale; jekyll-seo-tag defaulted it to en_US

# Link preview card for Kakao/Slack/X, generated by tools/make_images.py.
# jekyll-seo-tag only reads page.image -- a top-level site.image is ignored --
# so it is applied to every page through front matter defaults below.
twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-cover.jpg

# Parent program, shown in the sidebar as a nod to lineage
parent_name: 문우림
parent_name_en: Forest of Learning
parent_hanja: 文友林
parent_url: "https://cvt.kfas.or.kr/intro/type1.php"
repo_url: "https://github.com/eastasia-interdisciplinary/eastasia-interdisciplinary.github.io"
parent_blurb: >-
  한국고등교육재단(KFAS)이 운영하는 학부생 인재성장 프로그램으로, 동아시아
  고전을 함께 읽고 한·중·일 역사의 현장을 직접 답사하며 학문적 우정을
  쌓는 2년 과정입니다.
parent_blurb_en: >-
  A two-year talent-development program run by the Korea Foundation for
  Advanced Studies (KFAS), in which members read East Asian classics
  together and visit historical sites across Korea, China, and Japan.

markdown: kramdown
permalink: /news/:year/:month/:day/:title/

collections:
  seminar:
    output: true
    permalink: /seminar/:year-:month-:day-:title/
    sort_by: date

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools # importer scripts; they were being published alongside the site
