title: 동아시아학제연구모임
tagline: East Asia Interdisciplinary Studies Group
description: >-
  동아시아의 역사, 문화, 사회를 학제적으로 연구하는 모임입니다.
  한국고등교육재단 문우림(文友林)에서 출발하여 결성되었습니다.
description_en: >-
  A group researching East Asian history, culture, and society across
  disciplines. Formed by members who met through 문우림 (文友林), a
  program run by the Korea Foundation for Advanced Studies.
url: "https://eastasia-interdisciplinary.github.io"
baseurl: "" # root org page site, no path prefix

# Parent program, shown in the sidebar as a nod to lineage
parent_name: 문우림
parent_name_en: Forest of Learning
parent_hanja: 文友林
parent_url: "https://cvt.kfas.or.kr/intro/type1.php"
parent_blurb: >-
  한국고등교육재단이 운영하는 학부생 인재성장 프로그램으로, 동아시아 고전을
  함께 읽고 한·중·일 역사의 현장을 직접 답사하며 학문적 우정을 쌓는 2년
  과정입니다.
parent_blurb_en: >-
  A two-year talent-development program run by the Korea Foundation for
  Advanced Studies, in which members read East Asian classics together
  and visit historical sites across Korea, China, and Japan.

markdown: kramdown
permalink: /news/:year/:month/:day/:title/

collections:
  seminar:
    output: true
    permalink: /seminar/:year-:month-:day-:title/
    sort_by: date

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
