<!doctype html>
<meta charset="utf-8">
<title>모바일 미리보기 · Mobile preview</title>
<!--
  A phone-sized window onto the local preview, so the narrow layout can be
  looked at without resizing the browser.

      ./preview.sh              # in one terminal, leave it running
      open tools/mobile.html

  It is kept in tools/, which _config.yml excludes, so it is never published.
-->
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; gap: 1.1rem; padding: 1.6rem 1rem 2.4rem;
    background: #2b2b33; color: #e8e6df;
    font: 13px/1.5 -apple-system, "Pretendard", system-ui, sans-serif;
  }
  .bar { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 760px; }
  .bar button, .bar select {
    font: inherit; color: #e8e6df; background: #3a3a45;
    border: 1px solid #52525f; border-radius: 999px;
    padding: 0.35rem 0.8rem; cursor: pointer;
  }
  .bar button.on { background: #cfe0bd; color: #21234f; border-color: #cfe0bd; }
  .phone {
    border: 10px solid #14141a; border-radius: 34px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.45); background: #f6f4ec; overflow: hidden;
  }
  iframe { display: block; border: 0; width: 390px; height: 780px; }
  .note { color: #9a9aa6; font-size: 12px; }
  a { color: #cfe0bd; }
</style>

<div class="bar" id="pages"></div>
<div class="bar">
  <select id="size">
    <option value="320x720">320 × 720 · SE</option>
    <option value="375x760">375 × 760 · iPhone 8</option>
    <option value="390x780" selected>390 × 780 · iPhone 14</option>
    <option value="414x820">414 × 820 · Plus</option>
    <option value="768x900">768 × 900 · iPad</option>
  </select>
  <button id="reload">새로고침 · Reload</button>
</div>

<div class="phone"><iframe id="frame" src="http://127.0.0.1:4000/"></iframe></div>
<p class="note">
  <code>./preview.sh</code> 가 켜져 있어야 해. 언어 전환은 페이지 안의 한국어 / EN 로.
</p>

<script>
  var PAGES = [
    ["홈", "/"], ["소개", "/about/"], ["사람들", "/people/"],
    ["세미나", "/seminar/"], ["갤러리", "/gallery/"], ["소식", "/news/"],
    ["소식 하나", "/news/2025/09/22/first-seminar/"],
    ["세미나 하나", "/seminar/2025-09-22-generics-and-hatred/"]
  ];
  var frame = document.getElementById("frame");
  var bar = document.getElementById("pages");
  var current = "/";

  PAGES.forEach(function (page) {
    var b = document.createElement("button");
    b.textContent = page[0];
    b.onclick = function () {
      current = page[1];
      frame.src = "http://127.0.0.1:4000" + current;
      [].forEach.call(bar.children, function (x) { x.classList.remove("on"); });
      b.classList.add("on");
    };
    if (page[1] === "/") b.classList.add("on");
    bar.appendChild(b);
  });

  document.getElementById("size").onchange = function () {
    var wh = this.value.split("x");
    frame.style.width = wh[0] + "px";
    frame.style.height = wh[1] + "px";
  };
  document.getElementById("reload").onclick = function () {
    frame.src = "http://127.0.0.1:4000" + current + "?t=" + (frame.src.length + 1);
  };
</script>
