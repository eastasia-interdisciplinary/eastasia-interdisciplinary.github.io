# Which fields each member works in, for the map on the people page.
#
# This is an editorial reading of the 전공 answers, not something the survey
# asked, so it is kept here where the group can correct it rather than being
# inferred in code. Anyone listed under two fields is drawn between the two,
# which is the point of the map: it shows where the group actually overlaps.
#
# Order of `fields` sets where they sit around the map, so fields that share
# members are kept next to each other -- otherwise those members are drawn
# stretching across the middle. Run tools/build_graph.py after editing.
#
# Each field carries a colour, used for its name, its hub, the spokes running
# to it, and the ring around its members. All six are desaturated and of
# similar weight so none of them takes over the page, and so they sit with the
# navy and forest green the rest of the site is built from.

fields:
  - key: science
    name: 자연과학·공학
    name_en: Natural Sciences & Engineering
    color: "#55703c"
  - key: language
    name: 어문
    name_en: Language & Literature
    color: "#3f4a8c"
  - key: arts
    name: 예술
    name_en: Arts
    color: "#2f7a75"
  - key: history
    name: 역사
    name_en: History
    color: "#a1734a"
  - key: politics
    name: 정치·사회
    name_en: Politics & Society
    color: "#a05340"
  - key: philosophy
    name: 철학·사상
    name_en: Philosophy & Thought
    color: "#6b4a73"

members:
  김나원: [language, science]   # 전근대 언어 대상 자연어처리
  김지현: [arts, history]        # 미술사학 — art history sits between the two
  김채영: [philosophy, politics] # 정치사상사
  서은교: [history]
  성민경: [history]
  안진호: [history]
  엄윤주: [language]
  유미르: [language, arts]      # 동양 미술·이미지 연구
  유하린: [language, science]     # 국어교육 + 소프트웨어
  윤오산하: [language]
  이나현: [politics]
  이용우: [philosophy, science]  # 철학 + 물리학
  이유경: [arts, history]        # 한국음악사
  이찬희: [language, science]   # 코퍼스·통계 언어학
  이한석: [philosophy]
  전세은: [history]
  정우형: [politics, history]
  정재우: [language]
  정채연: [language, science]   # 디지털인문학, 시맨틱 DB 구축
  조민경: [science, language]     # 자연어처리
  진준표: [history]
  황승혁: [history, philosophy]   # 동양사학 · 사상사
