  bio: |-
    서울대학교 정치외교학과에서 정치학을 공부하고 있습니다. 개인이 정치공동체의 구성원으로서 정체성과 소속감을 형성하고, 정치적 태도와 집단행동으로 이어지는 과정에 관심이 있습니다.

    특히 동아시아의 역사적·문화적 맥락 속에서 공동체 의식과 정치적 정체성이 어떻게 형성되고 변화해 왔는지를 비교정치와 정치사상의 관점에서 탐구하고 있습니다. 이 과정에서 종교와 젠더 같은 사회문화적 요소가 어떠한 역할을 하는지에도 관심을 두고 있습니다.
  bio_en: |-
    I am a master’s student in political science at Seoul National University. My research interests center on how individuals develop identities and a sense of belonging as members of political communities, and how these shape political attitudes and collective action.

    Focusing on East Asia, I examine how collective belonging and political identities are formed and transformed within historical and cultural contexts, drawing on comparative politics and political thought. I am also interested in how sociocultural factors, including religion and gender, shape these processes.
