- name: "엄윤주"
  name_en: "Eom Yoon Ju"
  affiliation: "연세대학교, 대만사범대학교"
  affiliation_en: "Yonsei University, National Taiwan Normal University"
  field: "중어중문학"
  field_en: "Chinese"
  email: "yoonju1008@gmail.com"
  bio: |-
    연세대학교 중어중문학과 및 대만사범대학교 국문과 박사과정(복수학위)에 재학 중이며, 중국어 역사 음운학을 중심으로 동아시아 한자문화권의 음운 교류를 연구하고 있습니다.

    석사 과정에서는 한국 한자음을 주제로 하여 중국 중고음이 한반도에 유입되고 정착하는 양상을 살폈으며, 이 과정에서 동아시아 여러 언어가 한자음을 매개로 주고받았던 영향 관계에 관심을 가지게 되었습니다.

    박사과정에서는 분야를 심화하여 중국어 자체의 통시적 음운 변화를 규명하는 연구를 이어 나가고 있습니다. 특히 중국어 중고음에서 현대음에 이르기까지의 성모 체계 변천, 그중에서도 영성모화(零聲母化), 즉 자음 성분 소실 현상의 궤적을 밝히는 데 주된 관심을 두고 있습니다.

    아울러 언어 접촉이 중국어 음운 변화에 미치는 영향 및 동아시아 각지에 퍼진 중국어 관련 자료 속 대역음(對譯音), 음주(音注) 등을 활용한 중국어 음운체계 재구 방법에도 지속적으로 관심을 가지고 살피고 있습니다.
  bio_en: |-
    A PhD student in a dual-degree program between the Department of Chinese at Yonsei University and National Taiwan Normal University, working on Chinese historical phonology amid phonological exchange across East Asia's Sinographic sphere.

    Her master's thesis traced how Middle Chinese entered Korea and settled into an independent system, sparking interest in how East Asian languages shaped one another through Sinitic readings.

    Doctoral research deepens this into diachronic sound change in Chinese, particularly the trajectory of zero-initialization—the loss of consonantal onsets—from Middle to Modern Chinese, alongside interests in language contact and phonological reconstruction via transcription evidence from East Asia.

