  bio: |-
    저는 주로 신화나 전설, 민간신앙 등에 관심이 있습니다. 현재는 중국 중세 사상사를 공부하고 있습니다. 어떤 이야기가 선택적으로 전해지면서 변형되는 현상과 그러한 선택 및 변화의 원인이 되는 원인을 연구하고자 합니다.

    아직 구체적인 연구 분야를 정하지 못했지만, 제가 관심 있는 방향을 유지하고자 민간신앙이나 도교에 관한 연구를 잠정적으로 계획하고 있습니다.
  bio_en: |-
    I am interested in mythology, legends and folk beliefs and currently studying the history of medieval China. I am particularly interested in examining how certain narratives are selectively transmitted and transformed over time, as well as the factors that shape such processes of selection and change.

    Although I have not yet decided on a specific area of research, I am tentatively considering research on folk beliefs or Taoism in order to continue pursuing these interests.
