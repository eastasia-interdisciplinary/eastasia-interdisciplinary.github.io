- name: "서은교"
  name_en: "Eunkyo Suh"
  affiliation: "연세대학교"
  affiliation_en: "Yonsei University"
  field: "사학과"
  field_en: "Department of History"
  email: "suheunkyo@gmail.com"
  bio: |-
    조선 후기 사회경제사, 특히 상인과 상업 활동에 관심이 있습니다. 현재는 개성상인(송상)과 동래상인을 중심으로 이들의 자본 축적 방식과 행상 경로, 여러 지역에서 형성한 인적·상업적 관계망을 살펴보고자 합니다. 상인들의 이동과 거래, 지역적 연계를 통해 조선 후기 시장의 발달과 지역 간 교류의 양상을 탐구하는 데 관심이 있습니다.

    사학과에서 한국사를 전공하고 있으며, 문헌정보학을 복수전공하고 있습니다.
  bio_en: |-
    My research focuses on the social and economic history of late Joseon, particularly merchants and commercial activity. Currently, I am especially interested in the capital accumulation, itinerant trade routes, and personal and commercial networks of Gaeseong merchants (Songsang) and Dongnae merchants. By studying their mobility, transactions, and regional connections, I hope to examine the development of markets and patterns of regional exchange in late Joseon society.

    I major in History, specializing in Korean history, and am also pursuing a double major in Library and Information Science.

- name: "성민경"
  name_en: "Minkyoung Seong"
  affiliation: "서울대학교"
  affiliation_en: "Seoul National University"
  field: "국사학과"
  field_en: "Department of Korean History"
  email: "diplomat2001@naver.com"
  bio: |-
    한국불교사를 전공하며 전근대 동아시아 불교사에 관심을 두고 있습니다. 불교는 단순한 신앙이나 사상에 그치지 않고 전근대 사람들의 일상과 사회를 구성하며 여러 지역과 국가를 연결한 중요한 기반이었다고 생각합니다.

    이러한 관점에서 승려와 사상에 대한 연구 외에도 불상, 불화, 발굴 자료 등의 물질 자료, 사찰을 비롯한 불교 건축 등을 통해 불교가 사람들의 삶과 사회, 지역 간 관계 속에서 작동한 양상을 살펴보고자 합니다.

    #불교사 #한국고중세사 #동아시아선종사
  bio_en: |-
    I specialize in the history of Korean Buddhism and have a broader interest in the history of Buddhism in premodern East Asia. I understand Buddhism not simply as a system of belief or thought, but as a fundamental framework that shaped everyday life and society while connecting different regions and polities.

    From this perspective, in addition to research on Buddhist monks and thought, I am also interested in examining how Buddhism operated within people’s lives, social structures, and interregional relations through material sources such as Buddhist images, paintings, archaeological remains, and temple architecture.

    #BuddhistHistory #KoreanAncientAndMedievalHistory #EastAsianChanZenHistory

