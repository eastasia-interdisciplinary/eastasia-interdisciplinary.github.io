- name: "이한석"
  name_en: "Han Seok Lee"
  affiliation: "서울대학교"
  affiliation_en: "Seoul National University"
  field: "동양철학"
  field_en: "Oriental Philosophy"
  email: "gkstjrsla@snu.ac.kr"
  bio: |-
    18세기 조선 신유학 철학의 전개 과정, 그중에서도 조선 유학사의 양대 논쟁 중 하나인 호락논쟁(湖洛論爭)을 연구하고 있습니다. 특히 기존에 철학적 주도권을 형성하고 있던 이이(李珥)의 이론으로부터 김창협(金昌協)·김창흡(金昌翕) 형제가 이탈함으로써 호락논쟁의 실마리가 마련되었다는 점에 주목하고 있습니다.

    이에 두 형제가 제출한 새로운 이론이 인간의 의식적 능력인 ‘지각(知覺)’ 개념을 중심으로 구축되었다는 점에 초점을 맞춰 박사학위 논문을 준비 중입니다.

    나아가 김창협·김창흡 형제가 18세기의 문학·예술 분야에서도 중요한 변화의 계기를 마련했다는 점에도 관심을 기울이고 있으며, 이에 따라 철학적 논의를 문학·예술 사상으로 확장해나갈 수 있는 방법도 모색하고 있습니다.
  bio_en: |-
    My research examines 18th-century Chosŏn Neo-Confucianism philosophy, focusing on the Horak Debate 湖洛論爭. I highlight how the brothers Kim Ch’ang-hyŏp 金昌協 and Kim Ch’ang-hŭp 金昌翕 initiated this debate by departing from Yi I’s 李珥 dominant philosophical framework.

    I am preparing my doctoral dissertation on their new theory centered on the concept of jigak (zhijue 知覺).

    Furthermore, I explore how the Kim brothers transformed 18th-century literature and art, extending my research into literary and artistic thought.

