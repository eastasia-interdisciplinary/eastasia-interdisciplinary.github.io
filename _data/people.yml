- name: "이용우"
  name_en: "Yongwoo Yi"
  affiliation: "뮌헨대학교"
  affiliation_en: "LMU Munich"
  field: "철학"
  field_en: "Philosophy"
  email: "Y.Yi@campus.lmu.de"
  bio: |-
    저는 현재 독일정부초청장학생(DAAD Scholar)으로 뮌헨수리철학센터(Munich Center for Mathematical Philosophy)에서 철학과 물리학 석사과정을 밟고 있습니다. 주 연구 분야는 물리학의 철학이며, 그중에서도 양자 기초론 (Quantum Foundations) 분야에서 철학 및 이론 물리학 연구를 병행하고 있습니다.

    서울대학교 자유전공학부에서 철학과 물리학 학사 학위를 받았고, 한국고등교육재단의 문우림 1기 과정을 수료하였습니다.

    동아시아의 문화적 유산을 현대적으로 이해하고 활용하는 데에 관심이 있으며, 학제적 연구가 이를 촉진하는 데에 기여할 수 있다고 생각합니다.
  bio_en: |-
    I am currently a master’s student in philosophy and physics at the Munich Center for Mathematical Philosophy, funded by the German Academic Exchange Service (DAAD). My primary research area is the philosophy of physics, with a particular focus on quantum foundations.

    I obtained a B.A. in Philosophy and a B.S. in Physics from Seoul National University and completed the Moonwoorim Program at the Korea Foundation for Advanced Studies.

    I am interested in developing contemporary understandings and applications of East Asian thought, and I believe that interdisciplinary research can play a significant role in advancing this goal.

- name: "이유경"
  name_en: "Yugyeong Lee"
  affiliation: "이화여자대학교"
  affiliation_en: "Ewha Womans University"
  field: "한국음악과"
  field_en: "Korean Traditional Music"
  email: "yugyeong.lee0507@gmail.com"
  bio: |-
    이화여자대학교 일반대학원 음악학부 석사과정을 수료했다. 학부에서 한국음악과 함께 사학, 문헌정보학을 복수전공하며 한국음악을 실천적·문헌적 관점에서 통합적으로 탐구해 왔다.

    조선시대 궁중음악과 근대 한국음악을 중심으로 음악의 역사적 변천과 사회적 맥락을 연구하고 있다. 특히 정치·사회적 질서 속에서 음악이 소통되고 의미화되는 과정에 주목하며, 동아시아의 정치적 위계와 관계망 속에서 음악문화가 교류·변용되어 온 역사에 관심을 갖고 있다.

    주요 논문으로「조선시대 기로소 연향 고찰 - 숙종과 영조 代 기로소 입소 축하 진연을 중심으로 -」(2024)가 있다.
  bio_en: |-
    I completed my M.A. coursework in Musicology at Ewha Womans University. Building on my undergraduate studies in Korean Traditional Music, History, and Library & Information Science, I explore Korean music through both performance and textual sources.

    My research focuses on the socio-political contexts of Joseon court music and modern Korean music. I examine how musical cultures circulated and were transformed within East Asian political hierarchies.

    My major publication is "A study on the court banquets of Giroso in the Joseon Dynasty - Based on the celebration of King Sukjong and King Yeongjo's entrance into the Giroso -"

