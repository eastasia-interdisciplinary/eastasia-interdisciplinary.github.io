- name: "유하린"
  name_en: "Yu Harin"
  affiliation: "이화여자대학교"
  affiliation_en: "Ewha Womans University"
  field: "국어교육과"
  field_en: "Korean Language Education"
  email: "yuuhaarinn@gmail.com"
  bio: |-
    저는 국어교육을 주전공으로, 중어중문학과 소프트웨어를 복수전공하며 동아시아 언어·문화와 디지털 기술을 연결하는 데 관심을 두고 있습니다.

    동아시아의 언어·문화적 교류가 한국어의 형성과 변화에 미친 영향과 그것이 국문학 및 언어문화에 드러난 양상에 관심이 있습니다. 특히 한국과 중국을 비롯한 동아시아 사회의 언어 접촉과 교류를 살펴보고, 언어가 각 사회의 역사·문화적 맥락 속에서 어떻게 수용되고 변용되어 왔는지 탐구하고자 합니다.

    또한 생성형 인공지능을 활용한 국어교육 및 언어 연구 방법에 관심이 있습니다. 소프트웨어 전공에서 얻은 기술적 이해를 국어교육에 접목하여 생성형 AI가 언어 학습과 교육에 어떻게 활용될 수 있는지 탐색하고 있습니다.

    국어교육을 중심에 두되 동아시아 언어문화 연구와 디지털·AI 기반 연구 방법론을 결합하는 것을 연구 분야로 삼고 있습니다.
  bio_en: |-
    I major in Korean Language Education, with double majors in Chinese Language and Literature and Software. My research interests lie at the intersection of Korean language education, East Asian linguistic and cultural studies, and digital technology.

    I am particularly interested in how linguistic and cultural exchanges across East Asia have shaped the Korean language and how these influences are reflected in Korean literature and linguistic culture.

    I am also interested in the use of generative AI in Korean language education and linguistic research, integrating my background in software with approaches to language teaching and research.
