# Gallery entries. The page groups them by date, newest first.
#
# Each entry needs an image in assets/images/gallery/ (filenames must not start
# with an underscore -- Jekyll skips those). `date` is what the grouping keys
# off; `caption` is optional and shows on hover.
#
# Run photos through tools/prepare_photo.py first: it bakes the phone's
# rotation into the pixels and downscales, so nothing depends on a viewer
# honouring the EXIF tag. tools/photo_meta.py reads the date the phone
# recorded, from the ORIGINAL file -- the prepared copy no longer carries it.
#
# `event` and `event_en` sit beside the date and name the occasion in a few
# words; the first entry of a day that carries one names the whole day.
# `caption` belongs to a single photograph and shows on hovering it -- who is
# in the frame, or what it is a picture of.
#
# Photos of people other than the poster need their consent before going up:
# unlike the profile photos, nobody submitted these of themselves.

