# Member photos. Keys are the Korean name exactly as it appears in
# _data/people.yml; values are filenames inside assets/images/people/.
#
# This file is deliberately separate from people.yml because
# tools/import_people.py overwrites that file wholesale on every re-import.
# Photos are hand-curated, so they live here where the importer can't reach
# them. A member with no entry here shows an empty frame instead.
#
# Generated by tools/fetch_photos.py from the survey's Drive folder, which
# matches photos to members by Drive file ID. Re-run it if the folder gains
# new uploads, or add a line by hand for a photo supplied some other way.
#
# Filenames must not start with an underscore -- Jekyll skips those, so the
# card would render an <img> pointing at a file that never gets published.

