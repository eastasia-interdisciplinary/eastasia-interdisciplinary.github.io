<header class="site-header">
  <div class="site-header-inner">
    <div class="masthead-top">
      <h1 class="site-title">{{ site.title }}</h1>
      <div class="lang-toggle" role="group" aria-label="Language / 언어">
        <button type="button" class="lang-btn" data-set-lang="ko">한국어</button>
        <span class="lang-sep">/</span>
        <button type="button" class="lang-btn" data-set-lang="en">EN</button>
      </div>
    </div>
    <p class="site-tagline">{{ site.tagline }}</p>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
      <a href="{{ '/people/' | relative_url }}" class="{% if page.url == '/people/' %}active{% endif %}"><span class="i18n-ko">사람들</span><span class="i18n-en">People</span></a>
      <a href="{{ '/seminar/' | relative_url }}" class="{% if page.url == '/seminar/' or page.collection == 'seminar' %}active{% endif %}"><span class="i18n-ko">세미나</span><span class="i18n-en">Seminar</span></a>
    </nav>
  </div>
</header>
