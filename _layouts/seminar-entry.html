---
layout: default
---
<article class="post main-col" style="grid-column: 1 / -1; max-width: 720px;">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    {{ page.date | date: "%Y년 %-m월 %-d일" }}
    {% if page.presenter %} · 발제자: {{ page.presenter }}{% endif %}
  </div>
  {{ content }}
  <p><a href="{{ '/seminar/' | relative_url }}">&larr; 발제 목록으로</a></p>
</article>
