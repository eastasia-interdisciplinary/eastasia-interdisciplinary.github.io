---
layout: default
---
<article class="post main-col">
  <h1>
    <span class="i18n-ko">{{ page.title }}</span>
    <span class="i18n-en">{{ page.title_en | default: page.title }}</span>
  </h1>
  <div class="post-meta">
    <span class="i18n-ko">{{ page.date | date: "%Y년 %-m월 %-d일" }}</span>
    <span class="i18n-en">{{ page.date | date: "%B %-d, %Y" }}</span>
  </div>
  <div class="i18n-ko">{{ content }}</div>
  {% if page.content_en %}
    <div class="i18n-en">{{ page.content_en | markdownify }}</div>
  {% else %}
    <div class="i18n-en">{{ content }}</div>
  {% endif %}
  <a class="back-link" href="{{ '/' | relative_url }}">
    <span class="i18n-ko">&larr; 목록으로</span><span class="i18n-en">&larr; Back to News</span>
  </a>
</article>
