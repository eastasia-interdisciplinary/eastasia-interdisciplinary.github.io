---
layout: default
---
<article class="post main-col" style="grid-column: 1 / -1; max-width: 720px;">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">{{ page.date | date: "%Y년 %-m월 %-d일" }}</div>
  {{ content }}
  <a class="back-link" href="{{ '/' | relative_url }}">
    <span class="i18n-ko">&larr; 목록으로</span><span class="i18n-en">&larr; Back to News</span>
  </a>
</article>
